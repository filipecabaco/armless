# armless's site on Fly: `elixir site/build.exs`, then `fly deploy` from site/ (Dockerfile:
# site/_out served by site/server.exs, which sends the cross-origin isolation headers)
app = "armless"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
