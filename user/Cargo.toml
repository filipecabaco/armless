[package]
name = "armless-user"
version = "0.13.0"
edition = "2021"
publish = false
description = "User mode for armless: run a static aarch64 Linux ELF with no guest kernel, its syscalls answered by the host"
license = "BSD-2-Clause"

[[bin]]
name = "armless-exec"
path = "src/main.rs"

[dependencies]
armless = { path = ".." }

[features]
# Compile the wasm export layer (src/wasm.rs) natively, to type-check it without a wasm target.
wasm-api = ["armless/wasm-api"]

[lib]
name = "armless_user"
path = "src/lib.rs"
