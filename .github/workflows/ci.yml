name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
          rustup target add wasm32-unknown-unknown
          rustup component add rust-src
      - name: Unit tests and bare-metal guest
        run: cargo test --release
      - name: Type-check the wasm layer natively
        run: cargo check --features wasm-api
      - name: Build armless.wasm and armless-smp.wasm
        run: |
          sh build-wasm.sh
          SMP=1 sh build-wasm.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bare-metal guest through armless.js (interpreter, and every block JIT-compiled)
        run: |
          OUT="$RUNNER_TEMP/guest" sh guest/build.sh
          node tests/js/run-bare.mjs "$RUNNER_TEMP/guest/tests.bin" -m 512 --no-jit
          node tests/js/run-bare.mjs "$RUNNER_TEMP/guest/tests.bin" -m 512 --jit-threshold 1 --jit-sync
      - uses: actions/upload-artifact@v4
        with:
          name: armless-web
          path: |
            build/armless.wasm
            build/armless-smp.wasm
            js/armless.js

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu flex bison bc linux-source-6.8.0 qemu-user clang lld
          sudo pip install --break-system-packages zstandard
          rustup target add wasm32-unknown-unknown
          rustup component add rust-src
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache kernel
        id: kcache
        uses: actions/cache@v4
        with:
          path: build-linux
          key: linux-6.8-${{ hashFiles('tests/linux/armless_defconfig', 'tests/linux/init.c', 'tests/linux/mkcpio.py') }}
      - name: Build kernel and initramfs
        if: steps.kcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/linux"
          tar xjf /usr/src/linux-source-6.8.0/linux-source-6.8.0.tar.bz2 -C "$RUNNER_TEMP/linux"
          sh tests/linux/build.sh "$RUNNER_TEMP/linux/linux-source-6.8.0" build-linux
      - name: Boot Linux to userspace
        run: sh tests/linux/boot.sh build-linux
      - name: Build busybox + glibc rootfs
        run: |
          git clone --depth 1 https://github.com/mirror/busybox "$RUNNER_TEMP/busybox"
          sh tests/linux/build-rootfs.sh "$RUNNER_TEMP/busybox" build-linux
      - name: Userspace matches qemu-aarch64
        run: |
          if ! sh tests/linux/userspace.sh build-linux > userspace.log 2>&1; then
            cat userspace.log
            echo "::error title=userspace::$(tail -c 1500 userspace.log | tr -d '\r%' | tr '\n' ';')"
            exit 1
          fi
      - name: SMP (2 and 4 CPUs; atomics, futexes, TLB shootdowns) matches qemu-aarch64
        run: |
          for n in 2 4; do
            if ! sh tests/linux/smp.sh build-linux $n > smp.log 2>&1; then
              cat smp.log
              echo "::error title=smp $n CPUs::$(tail -c 1500 smp.log | tr -d '\r%' | tr '\n' ';')"
              exit 1
            fi
            cat smp.log
          done
      - name: The snowglobe flow, natively (9p root, console, snapshot, restore; 1 and 2 CPUs)
        run: |
          gzip -9 -k -f build-linux/Image
          sh tests/fs/make-9pfs.sh build-linux/busybox build-linux/Image.gz build-linux/9pfs
          ARMLESS_9PFS=build-linux/9pfs cargo test --release --test vm
      - name: Build armless.wasm and armless-smp.wasm
        run: |
          sh build-wasm.sh
          SMP=1 sh build-wasm.sh
      - name: Userspace through armless.js with the JIT matches qemu-aarch64
        run: |
          node tests/js/boot.mjs --cmdline "console=ttyS0 rdinit=/init quiet" \
              --expect ARMLESS-USERSPACE-OK build-linux/Image.gz build-linux/rootfs.cpio > js-userspace.log
          sed -n '/^== userspace ==/,/^ARMLESS-USERSPACE-OK/p' js-userspace.log \
              | grep -v -e '^== ' -e '^ARMLESS-USERSPACE-OK' -e '^dc' | tr -d '\r' > js-dut.txt
          if ! diff -u build-linux/ref.txt js-dut.txt > js-diff.txt; then
            cat js-diff.txt
            echo "::error title=userspace (armless.js + JIT)::$(head -c 1500 js-diff.txt | tr -d '\r%' | tr '\n' ';')"
            exit 1
          fi
      - name: The snowglobe flow through armless.js (1, 2 and 4 CPUs; HTTP over fetch, port forwarding)
        run: |
          for n in 1 2 4; do
            if ! node tests/js/flow.mjs build-linux/9pfs $n > flow.log 2>&1; then
              cat flow.log
              echo "::error title=flow $n CPUs::$(tail -c 1500 flow.log | tr -d '\r%' | tr '\n' ';')"
              exit 1
            fi
            cat flow.log
          done

  difftest:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        classes: [int, fp, simd, simds, ldst]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm gcc-aarch64-linux-gnu qemu-user
          rustup target add wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Differential test against qemu-aarch64
        run: |
          for seed in 1 2 3; do
            if ! sh tests/difftest/run.sh ${{ matrix.classes }} 10000 $seed; then
              echo "::error title=difftest ${{ matrix.classes }} seed $seed::$(grep -E '^[-+][0-9]' build-difftest/diff.txt | head -12 | tr '\n' ';')"
              exit 1
            fi
          done
      - name: Differential test of the wasm JIT against qemu-aarch64
        run: |
          sh build-wasm.sh
          for seed in 1 2; do
            if ! DUT=jit sh tests/difftest/run.sh ${{ matrix.classes }} 5000 $seed; then
              echo "::error title=difftest jit ${{ matrix.classes }} seed $seed::$(grep -E '^[-+][0-9]' build-difftest/diff.txt | head -12 | tr '\n' ';')"
              exit 1
            fi
          done

  alpine:
    # A real arm64 Alpine (linux-virt + OpenRC), prepared and booted the way
    # snowglobe does it, through armless.js.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Toolchain
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang lld
          sudo pip install --break-system-packages zstandard
          rustup target add wasm32-unknown-unknown
          rustup component add rust-src
      - name: Build armless.wasm and armless-smp.wasm
        run: |
          sh build-wasm.sh
          SMP=1 sh build-wasm.sh
      - name: Build the Alpine arm64 guest as a 9p filesystem
        run: sh tests/fs/alpine/build.sh "$RUNNER_TEMP/alpine"
      - name: Boot Alpine, run commands, save and restore a snapshot (1 and 2 CPUs)
        run: |
          node tests/js/alpine.mjs "$RUNNER_TEMP/alpine" 1
          node tests/js/alpine.mjs "$RUNNER_TEMP/alpine" 2
