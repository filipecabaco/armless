name: ci

# Branches pushed to this repository get their run from the pull request; a push to one would run
# every job a second time. main still runs on push: its own result, and the cache pull requests restore.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels the run it supersedes; every commit on main runs to the end
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every job's Ubuntu packages (the sets of .github/actions/apt/packages.txt), fetched once per
  # runner image into GitHub's cache, before the jobs that install them from there with no mirror:
  # when Ubuntu's mirrors fail, only this job does, and it is the one to run again
  packages:
    name: packages (${{ matrix.set }}, ${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, set: wasm }
          - { runner: ubuntu-24.04, set: linux }
          - { runner: ubuntu-24.04, set: difftest }
          - { runner: ubuntu-24.04-arm, set: wasm }
          - { runner: ubuntu-24.04-arm, set: alpine }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
      - uses: ./.github/actions/apt
        with:
          set: ${{ matrix.set }}
          fetch-only: "true"

  core:
    needs: packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Ubuntu packages, from GitHub's cache (the packages job fetched them there)
      - uses: ./.github/actions/apt
        with:
          set: wasm
      - name: Toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          rustup component add rust-src
      # The dependencies, compiled: restored everywhere, saved by main only (build/ is the target dir)
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> build"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The workspace: armless, and user mode (user/)
      # (armless-gpu's tests run on mesa-vulkan-drivers' lavapipe, a software Vulkan device)
      - name: Unit tests and bare-metal guest
        run: cargo test --release --workspace
        env:
          ARMLESS_GPU_TEST_REQUIRE: "1"
      # The guests' webgpu_cpp.h against armless-gpu-server on lavapipe: writes and reads larger
      # than a frame, and ranges outside a buffer refused
      - name: Guest WebGPU header against the GPU host
        run: |
          cargo build --release -p armless-gpu --bin armless-gpu-server
          c++ -std=c++17 -Wall -Wextra -I gpu/guest/include gpu/guest/tests/transfers.cpp -o "$RUNNER_TEMP/transfers"
          build/release/armless-gpu-server 127.0.0.1:7070 &
          server=$!
          trap 'kill $server' EXIT
          up=
          for _ in $(seq 50); do (echo > /dev/tcp/127.0.0.1/7070) 2>/dev/null && { up=1; break; }; sleep 0.2; done
          [ -n "$up" ] || { echo "armless-gpu-server did not come up"; exit 1; }
          ARMLESS_GPU=127.0.0.1:7070 "$RUNNER_TEMP/transfers"
      # The dev profile checks arithmetic for overflow; release wraps silently
      - name: Unit tests with overflow checks
        run: cargo test --workspace
      # User mode's tests again with their programs' threads on four CPUs at once (user/src/smp.rs)
      - name: User mode on several CPUs
        run: ARMLESS_TEST_CPUS=4 cargo test --release -p armless-user
      - name: Type-check the wasm layer natively
        run: |
          cargo check --features wasm-api
          cargo check -p armless-user --features wasm-api
          cargo test -p armless-user --features wasm-api --lib wasm::
      - name: Lints (unsafe only where allowed, and documented), natively and for wasm32
        run: |
          rustup component add clippy
          cargo clippy --release --all-targets --features wasm-api --workspace
          # User mode with default features off: armless and armless-user with no native JIT
          cargo clippy --release --all-targets -p armless-user --no-default-features
          cargo clippy --lib --target wasm32-unknown-unknown --no-default-features --features wasm-api
          cargo clippy -p armless-user --lib --target wasm32-unknown-unknown --features wasm-api
      - name: Build armless.wasm and armless-smp.wasm
        run: |
          sh build-wasm.sh
          SMP=1 sh build-wasm.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Bare-metal guest through armless.js (interpreter, and every block JIT-compiled)
        run: |
          OUT="$RUNNER_TEMP/guest" sh guest/build.sh
          node tests/js/run-bare.mjs "$RUNNER_TEMP/guest/tests.bin" -m 512 --no-jit
          node tests/js/run-bare.mjs "$RUNNER_TEMP/guest/tests.bin" -m 512 --jit-threshold 1 --jit-sync
      # armless.js's user-mode API (argv and env, exec options, reap_orphans, user_asleep_ms) on
      # armless.wasm: the test makes its programs as machine code and its filesystem in memory
      - name: User mode through armless.js
        run: node --test 'tests/js/*.test.mjs'
      # armless-gpu.js on a real WebGPU: Dawn (the webgpu package) on lavapipe, which has the
      # shader-f16 llama.cpp's WebGPU backend needs (Chromium's SwiftShader doesn't)
      - name: armless-gpu.js on Dawn
        run: |
          npm install --prefix "$RUNNER_TEMP/webgpu" --no-save --no-audit --no-fund webgpu@0.6.2
          WEBGPU_MODULE="$RUNNER_TEMP/webgpu/node_modules/webgpu/index.js" ARMLESS_GPU_TEST_REQUIRE=1 node --test tests/js/gpu.test.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: armless-web
          path: |
            build/armless.wasm
            build/armless-smp.wasm
            js/armless.js
            js/armless-gpu.js

  # An aarch64 host: the interpreter's floating point checked against the host FPU (src/fp.rs),
  # and the native JIT through Cranelift's arm64 backend
  arm64:
    needs: packages
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      # Ubuntu packages, from GitHub's cache (the packages job fetched them there)
      - uses: ./.github/actions/apt
        with:
          set: wasm
      - name: Toolchain
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      # The dependencies, compiled: restored everywhere, saved by main only (build/ is the target dir)
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> build"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Unit tests and bare-metal guest
        run: cargo test --release --workspace
      - name: Unit tests with overflow checks
        run: cargo test --workspace
      # The KVM backend (src/cpu/kvm.rs) is built only with the hypervisor feature on Linux arm64:
      # checked here, where it compiles (running it needs /dev/kvm, which the runner hasn't)
      - name: The hypervisor feature (KVM backend)
        run: |
          rustup component add clippy
          cargo clippy --release --all-targets --features hypervisor --workspace

  linux:
    needs: packages
    runs-on: ubuntu-24.04
    env:
      LINUX_VERSION: 6.18.60
      LINUX_SHA256: 3c2f44ef6acc021a7ad444d9a2e6ec1ef488ff09368793d0004a6080f69d621e
    steps:
      - uses: actions/checkout@v7
      # Ubuntu packages, from GitHub's cache (the packages job fetched them there)
      - uses: ./.github/actions/apt
        with:
          set: linux
      - name: Toolchain
        run: |
          sudo pip install --break-system-packages zstandard
          rustup target add wasm32-unknown-unknown
          rustup component add rust-src
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> build"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The kernel snowglobe's machines run (internal/boot/kernel.Dockerfile there): 6.10 and later
      # take a VM generation ID from the device tree (CONFIG_VMGENID), so a restore reseeds Linux's
      # generator, which tests/vm.rs checks
      - name: Cache kernel
        id: kcache
        uses: actions/cache@v6
        with:
          path: build-linux
          key: linux-${{ env.LINUX_VERSION }}-${{ hashFiles('tests/linux/armless_defconfig', 'tests/linux/init.c', 'tests/linux/mkcpio.py') }}
      - name: Build kernel and initramfs
        if: steps.kcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/linux"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/linux.tar.xz" "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-$LINUX_VERSION.tar.xz"
          echo "$LINUX_SHA256  $RUNNER_TEMP/linux.tar.xz" | sha256sum -c -
          tar xJf "$RUNNER_TEMP/linux.tar.xz" -C "$RUNNER_TEMP/linux"
          sh tests/linux/build.sh "$RUNNER_TEMP/linux/linux-$LINUX_VERSION" build-linux
      - name: Boot Linux to userspace
        run: sh tests/linux/boot.sh build-linux
      - name: Free page reporting shrinks snapshots
        run: sh tests/linux/free-pages.sh build-linux
      - name: Build busybox + glibc rootfs
        run: |
          git clone --depth 1 https://github.com/mirror/busybox "$RUNNER_TEMP/busybox"
          sh tests/linux/build-rootfs.sh "$RUNNER_TEMP/busybox" build-linux
      - name: Userspace matches qemu-aarch64
        run: |
          if ! sh tests/linux/userspace.sh build-linux > userspace.log 2>&1; then
            cat userspace.log
            echo "::error title=userspace::$(tail -c 1500 userspace.log | tr -d '\r%' | tr '\n' ';')"
            exit 1
          fi
      - name: SMP (2 and 4 CPUs; atomics, futexes, TLB shootdowns) matches qemu-aarch64
        run: |
          for n in 2 4; do
            if ! sh tests/linux/smp.sh build-linux $n > smp.log 2>&1; then
              cat smp.log
              echo "::error title=smp $n CPUs::$(tail -c 1500 smp.log | tr -d '\r%' | tr '\n' ';')"
              exit 1
            fi
            cat smp.log
          done
      - name: The snowglobe flow, natively (9p root, console, snapshot, restore; 1 and 2 CPUs)
        run: |
          gzip -9 -k -f build-linux/Image
          sh tests/fs/make-9pfs.sh build-linux/busybox build-linux/Image.gz build-linux/9pfs
          ARMLESS_9PFS=build-linux/9pfs cargo test --release --test vm
      - name: With the native JIT (x86_64 host code), userspace and SMP match qemu-aarch64, and the snowglobe flow
        env:
          ARMLESS_JIT: native
        run: |
          if ! sh tests/linux/userspace.sh build-linux > userspace.log 2>&1; then
            cat userspace.log
            echo "::error title=userspace, native JIT::$(tail -c 1500 userspace.log | tr -d '\r%' | tr '\n' ';')"
            exit 1
          fi
          for n in 2 4; do
            if ! sh tests/linux/smp.sh build-linux $n > smp.log 2>&1; then
              cat smp.log
              echo "::error title=smp $n CPUs, native JIT::$(tail -c 1500 smp.log | tr -d '\r%' | tr '\n' ';')"
              exit 1
            fi
          done
          ARMLESS_9PFS=build-linux/9pfs cargo test --release --test vm
      - name: Build armless.wasm and armless-smp.wasm
        run: |
          sh build-wasm.sh
          SMP=1 sh build-wasm.sh
      - name: Userspace through armless.js with the JIT matches qemu-aarch64
        run: |
          node tests/js/boot.mjs --cmdline "console=ttyS0 rdinit=/init quiet" \
              --expect ARMLESS-USERSPACE-OK build-linux/Image.gz build-linux/rootfs.cpio > js-userspace.log
          sed -n '/^== userspace ==/,/^ARMLESS-USERSPACE-OK/p' js-userspace.log \
              | grep -v -e '^== ' -e '^ARMLESS-USERSPACE-OK' -e '^dc' | tr -d '\r' > js-dut.txt
          if ! diff -u build-linux/ref.txt js-dut.txt > js-diff.txt; then
            cat js-diff.txt
            echo "::error title=userspace (armless.js + JIT)::$(head -c 1500 js-diff.txt | tr -d '\r%' | tr '\n' ';')"
            exit 1
          fi
      - name: The snowglobe flow through armless.js (1, 2 and 4 CPUs; HTTP over fetch, port forwarding)
        run: |
          for n in 1 2 4; do
            if ! node tests/js/flow.mjs build-linux/9pfs $n > flow.log 2>&1; then
              cat flow.log
              echo "::error title=flow $n CPUs::$(tail -c 1500 flow.log | tr -d '\r%' | tr '\n' ';')"
              exit 1
            fi
            cat flow.log
          done

  difftest:
    needs: packages
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        classes: [int, fp, simd, simds, ldst, crypto, lse]
    steps:
      - uses: actions/checkout@v7
      # Ubuntu packages, from GitHub's cache (the packages job fetched them there)
      - uses: ./.github/actions/apt
        with:
          set: difftest
      - name: Toolchain
        run: |
          rustup target add wasm32-unknown-unknown
      # The classes build the same thing: one of them saves the cache they all restore
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> build"
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.classes == 'int' }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Differential test against qemu-aarch64
        run: |
          for seed in 1 2 3; do
            if ! sh tests/difftest/run.sh ${{ matrix.classes }} 10000 $seed; then
              echo "::error title=difftest ${{ matrix.classes }} seed $seed::$(grep -E '^[-+][0-9]' build-difftest/diff.txt | head -12 | tr '\n' ';')"
              exit 1
            fi
          done
      - name: Differential test of the wasm JIT against qemu-aarch64
        run: |
          sh build-wasm.sh
          for seed in 1 2; do
            if ! DUT=jit sh tests/difftest/run.sh ${{ matrix.classes }} 5000 $seed; then
              echo "::error title=difftest jit ${{ matrix.classes }} seed $seed::$(grep -E '^[-+][0-9]' build-difftest/diff.txt | head -12 | tr '\n' ';')"
              exit 1
            fi
          done

  alpine:
    needs: packages
    # A real arm64 Alpine (linux-virt + OpenRC), prepared and booted the way
    # snowglobe does it, through armless.js. On an arm64 runner, so the image builds natively
    # instead of under QEMU's binfmt emulation.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Ubuntu packages, from GitHub's cache (the packages job fetched them there)
      - uses: ./.github/actions/apt
        with:
          set: alpine
      - name: Toolchain
        run: |
          sudo pip install --break-system-packages zstandard
          rustup target add wasm32-unknown-unknown
          rustup component add rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> build"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build armless.wasm and armless-smp.wasm
        run: |
          sh build-wasm.sh
          SMP=1 sh build-wasm.sh
      - name: Build the Alpine arm64 guest as a 9p filesystem
        run: sh tests/fs/alpine/build.sh "$RUNNER_TEMP/alpine"
      - name: Boot Alpine, run commands, save and restore a snapshot (1 and 2 CPUs)
        run: |
          node tests/js/alpine.mjs "$RUNNER_TEMP/alpine" 1
          node tests/js/alpine.mjs "$RUNNER_TEMP/alpine" 2
