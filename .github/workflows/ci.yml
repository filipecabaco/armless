name: ci

# Branches pushed to this repository get their run from the pull request; a push to one would run
# every job a second time. main still runs on push: its own result, and the cache pull requests restore.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels the run it supersedes; every commit on main runs to the end
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Ubuntu packages: from GitHub's cache once this runner image has had them (.github/actions/apt)
      - uses: ./.github/actions/apt
        with:
          packages: clang lld llvm
      - name: Toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          rustup component add rust-src
      # The dependencies, compiled: restored everywhere, saved by main only (build/ is the target dir)
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> build"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The workspace: armless, and user mode (user/)
      - name: Unit tests and bare-metal guest
        run: cargo test --release --workspace
      # The dev profile checks arithmetic for overflow; release wraps silently
      - name: Unit tests with overflow checks
        run: cargo test --workspace
      - name: Type-check the wasm layer natively
        run: cargo check --features wasm-api
      - name: Lints (unsafe only where allowed, and documented), natively and for wasm32
        run: |
          rustup component add clippy
          cargo clippy --release --all-targets --features wasm-api --workspace
          cargo clippy --lib --target wasm32-unknown-unknown --no-default-features --features wasm-api
      - name: Build armless.wasm and armless-smp.wasm
        run: |
          sh build-wasm.sh
          SMP=1 sh build-wasm.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Bare-metal guest through armless.js (interpreter, and every block JIT-compiled)
        run: |
          OUT="$RUNNER_TEMP/guest" sh guest/build.sh
          node tests/js/run-bare.mjs "$RUNNER_TEMP/guest/tests.bin" -m 512 --no-jit
          node tests/js/run-bare.mjs "$RUNNER_TEMP/guest/tests.bin" -m 512 --jit-threshold 1 --jit-sync
      - uses: actions/upload-artifact@v7
        with:
          name: armless-web
          path: |
            build/armless.wasm
            build/armless-smp.wasm
            js/armless.js

  # An aarch64 host: the interpreter's floating point checked against the host FPU (src/fp.rs),
  # and the native JIT through Cranelift's arm64 backend
  arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      # Ubuntu packages: from GitHub's cache once this runner image has had them (.github/actions/apt)
      - uses: ./.github/actions/apt
        with:
          packages: clang lld llvm
      - name: Toolchain
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      # The dependencies, compiled: restored everywhere, saved by main only (build/ is the target dir)
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> build"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Unit tests and bare-metal guest
        run: cargo test --release --workspace
      - name: Unit tests with overflow checks
        run: cargo test --workspace
      # The KVM backend (src/cpu/kvm.rs) is built only with the hypervisor feature on Linux arm64:
      # checked here, where it compiles (running it needs /dev/kvm, which the runner hasn't)
      - name: The hypervisor feature (KVM backend)
        run: |
          rustup component add clippy
          cargo clippy --release --all-targets --features hypervisor --workspace

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Ubuntu packages: from GitHub's cache once this runner image has had them (.github/actions/apt)
      - uses: ./.github/actions/apt
        with:
          packages: gcc-aarch64-linux-gnu flex bison bc linux-source-6.8.0 qemu-user clang lld
      - name: Toolchain
        run: |
          sudo pip install --break-system-packages zstandard
          rustup target add wasm32-unknown-unknown
          rustup component add rust-src
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> build"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Cache kernel
        id: kcache
        uses: actions/cache@v6
        with:
          path: build-linux
          key: linux-6.8-${{ hashFiles('tests/linux/armless_defconfig', 'tests/linux/init.c', 'tests/linux/mkcpio.py') }}
      - name: Build kernel and initramfs
        if: steps.kcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/linux"
          tar xjf /usr/src/linux-source-6.8.0/linux-source-6.8.0.tar.bz2 -C "$RUNNER_TEMP/linux"
          sh tests/linux/build.sh "$RUNNER_TEMP/linux/linux-source-6.8.0" build-linux
      - name: Boot Linux to userspace
        run: sh tests/linux/boot.sh build-linux
      - name: Build busybox + glibc rootfs
        run: |
          git clone --depth 1 https://github.com/mirror/busybox "$RUNNER_TEMP/busybox"
          sh tests/linux/build-rootfs.sh "$RUNNER_TEMP/busybox" build-linux
      - name: Userspace matches qemu-aarch64
        run: |
          if ! sh tests/linux/userspace.sh build-linux > userspace.log 2>&1; then
            cat userspace.log
            echo "::error title=userspace::$(tail -c 1500 userspace.log | tr -d '\r%' | tr '\n' ';')"
            exit 1
          fi
      - name: SMP (2 and 4 CPUs; atomics, futexes, TLB shootdowns) matches qemu-aarch64
        run: |
          for n in 2 4; do
            if ! sh tests/linux/smp.sh build-linux $n > smp.log 2>&1; then
              cat smp.log
              echo "::error title=smp $n CPUs::$(tail -c 1500 smp.log | tr -d '\r%' | tr '\n' ';')"
              exit 1
            fi
            cat smp.log
          done
      - name: The snowglobe flow, natively (9p root, console, snapshot, restore; 1 and 2 CPUs)
        run: |
          gzip -9 -k -f build-linux/Image
          sh tests/fs/make-9pfs.sh build-linux/busybox build-linux/Image.gz build-linux/9pfs
          ARMLESS_9PFS=build-linux/9pfs cargo test --release --test vm
      - name: With the native JIT (x86_64 host code), userspace and SMP match qemu-aarch64, and the snowglobe flow
        env:
          ARMLESS_JIT: native
        run: |
          if ! sh tests/linux/userspace.sh build-linux > userspace.log 2>&1; then
            cat userspace.log
            echo "::error title=userspace, native JIT::$(tail -c 1500 userspace.log | tr -d '\r%' | tr '\n' ';')"
            exit 1
          fi
          for n in 2 4; do
            if ! sh tests/linux/smp.sh build-linux $n > smp.log 2>&1; then
              cat smp.log
              echo "::error title=smp $n CPUs, native JIT::$(tail -c 1500 smp.log | tr -d '\r%' | tr '\n' ';')"
              exit 1
            fi
          done
          ARMLESS_9PFS=build-linux/9pfs cargo test --release --test vm
      - name: Build armless.wasm and armless-smp.wasm
        run: |
          sh build-wasm.sh
          SMP=1 sh build-wasm.sh
      - name: Userspace through armless.js with the JIT matches qemu-aarch64
        run: |
          node tests/js/boot.mjs --cmdline "console=ttyS0 rdinit=/init quiet" \
              --expect ARMLESS-USERSPACE-OK build-linux/Image.gz build-linux/rootfs.cpio > js-userspace.log
          sed -n '/^== userspace ==/,/^ARMLESS-USERSPACE-OK/p' js-userspace.log \
              | grep -v -e '^== ' -e '^ARMLESS-USERSPACE-OK' -e '^dc' | tr -d '\r' > js-dut.txt
          if ! diff -u build-linux/ref.txt js-dut.txt > js-diff.txt; then
            cat js-diff.txt
            echo "::error title=userspace (armless.js + JIT)::$(head -c 1500 js-diff.txt | tr -d '\r%' | tr '\n' ';')"
            exit 1
          fi
      - name: The snowglobe flow through armless.js (1, 2 and 4 CPUs; HTTP over fetch, port forwarding)
        run: |
          for n in 1 2 4; do
            if ! node tests/js/flow.mjs build-linux/9pfs $n > flow.log 2>&1; then
              cat flow.log
              echo "::error title=flow $n CPUs::$(tail -c 1500 flow.log | tr -d '\r%' | tr '\n' ';')"
              exit 1
            fi
            cat flow.log
          done

  difftest:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        classes: [int, fp, simd, simds, ldst, crypto, lse]
    steps:
      - uses: actions/checkout@v7
      # Ubuntu packages: from GitHub's cache once this runner image has had them (.github/actions/apt)
      - uses: ./.github/actions/apt
        with:
          packages: clang lld llvm gcc-aarch64-linux-gnu qemu-user
      - name: Toolchain
        run: |
          rustup target add wasm32-unknown-unknown
      # The classes build the same thing: one of them saves the cache they all restore
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> build"
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.classes == 'int' }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Differential test against qemu-aarch64
        run: |
          for seed in 1 2 3; do
            if ! sh tests/difftest/run.sh ${{ matrix.classes }} 10000 $seed; then
              echo "::error title=difftest ${{ matrix.classes }} seed $seed::$(grep -E '^[-+][0-9]' build-difftest/diff.txt | head -12 | tr '\n' ';')"
              exit 1
            fi
          done
      - name: Differential test of the wasm JIT against qemu-aarch64
        run: |
          sh build-wasm.sh
          for seed in 1 2; do
            if ! DUT=jit sh tests/difftest/run.sh ${{ matrix.classes }} 5000 $seed; then
              echo "::error title=difftest jit ${{ matrix.classes }} seed $seed::$(grep -E '^[-+][0-9]' build-difftest/diff.txt | head -12 | tr '\n' ';')"
              exit 1
            fi
          done

  alpine:
    # A real arm64 Alpine (linux-virt + OpenRC), prepared and booted the way
    # snowglobe does it, through armless.js. On an arm64 runner, so the image builds natively
    # instead of under QEMU's binfmt emulation.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Ubuntu packages: from GitHub's cache once this runner image has had them (.github/actions/apt)
      - uses: ./.github/actions/apt
        with:
          packages: clang lld
      - name: Toolchain
        run: |
          sudo pip install --break-system-packages zstandard
          rustup target add wasm32-unknown-unknown
          rustup component add rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> build"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build armless.wasm and armless-smp.wasm
        run: |
          sh build-wasm.sh
          SMP=1 sh build-wasm.sh
      - name: Build the Alpine arm64 guest as a 9p filesystem
        run: sh tests/fs/alpine/build.sh "$RUNNER_TEMP/alpine"
      - name: Boot Alpine, run commands, save and restore a snapshot (1 and 2 CPUs)
        run: |
          node tests/js/alpine.mjs "$RUNNER_TEMP/alpine" 1
          node tests/js/alpine.mjs "$RUNNER_TEMP/alpine" 2
