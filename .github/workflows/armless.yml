name: armless

on:
  push:
    paths: ["arm/**", ".github/workflows/armless.yml"]
  pull_request:
    paths: ["arm/**", ".github/workflows/armless.yml"]
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: arm
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
          rustup target add wasm32-unknown-unknown
      - name: Unit tests and bare-metal guest
        run: cargo test
      - name: Type-check the wasm layer natively
        run: cargo check --features wasm-api
      - name: Build armless.wasm
        run: |
          cargo build --release --lib --target wasm32-unknown-unknown
          cp ../build/wasm32-unknown-unknown/release/armless.wasm .
          ls -la armless.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: armless-wasm
          path: arm/armless.wasm

  linux-boot:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: arm
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu flex bison bc linux-source-6.8.0 qemu-user
      - name: Cache kernel
        id: kcache
        uses: actions/cache@v4
        with:
          path: arm/build-linux
          key: linux-6.8-${{ hashFiles('arm/tests/linux/armless_defconfig', 'arm/tests/linux/init.c', 'arm/tests/linux/mkcpio.py') }}
      - name: Build kernel and initramfs
        if: steps.kcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/linux"
          tar xjf /usr/src/linux-source-6.8.0/linux-source-6.8.0.tar.bz2 -C "$RUNNER_TEMP/linux"
          sh tests/linux/build.sh "$RUNNER_TEMP/linux/linux-source-6.8.0" build-linux
      - name: Boot Linux to userspace
        run: sh tests/linux/boot.sh build-linux
      - name: Build busybox + glibc rootfs
        run: |
          git clone --depth 1 https://github.com/mirror/busybox "$RUNNER_TEMP/busybox"
          sh tests/linux/build-rootfs.sh "$RUNNER_TEMP/busybox" build-linux
      - name: Userspace matches qemu-aarch64
        run: sh tests/linux/userspace.sh build-linux
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build armless.wasm
        run: |
          sudo apt-get install -y clang lld
          rustup target add wasm32-unknown-unknown
          sh build-wasm.sh
      - name: Boot through the V86 JS API (arch arm64, gzip kernel)
        run: |
          gzip -9 -k -f build-linux/Image
          node ../tests/arm/boot.mjs build-linux/Image.gz build-linux/initrd.cpio --expect ARMLESS-BOOT-OK
      - name: snowglobe flow (9p root, virtio console, save/restore zstd snapshot)
        run: |
          pip install --break-system-packages zstandard
          sh ../tests/arm/make-9pfs.sh build-linux/busybox build-linux/Image.gz build-linux/9pfs
          node ../tests/arm/snowglobe.mjs build-linux/9pfs

  difftest:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: arm
    strategy:
      matrix:
        classes: [int, fp, simd, simds, ldst]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm gcc-aarch64-linux-gnu qemu-user
      - name: Differential test against qemu-aarch64
        run: |
          for seed in 1 2 3; do
            sh tests/difftest/run.sh ${{ matrix.classes }} 10000 $seed
          done
