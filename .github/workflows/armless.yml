name: armless

on:
  push:
    paths: ["arm/**", "src/arm/**", "tests/arm/**", "src/browser/starter.js", ".github/workflows/armless.yml"]
  pull_request:
    paths: ["arm/**", "src/arm/**", "tests/arm/**", "src/browser/starter.js", ".github/workflows/armless.yml"]
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: arm
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
          rustup target add wasm32-unknown-unknown
      - name: Unit tests and bare-metal guest
        run: cargo test
      - name: Type-check the wasm layer natively
        run: cargo check --features wasm-api
      - name: Build armless.wasm
        run: |
          sh build-wasm.sh
          cp ../build/armless.wasm .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bare-metal guest on armless.wasm (interpreter, and every entry JIT-compiled)
        run: |
          OUT="$RUNNER_TEMP/guest" sh guest/build.sh
          node ../tests/arm/run-bare.mjs "$RUNNER_TEMP/guest/tests.bin" -m 512 --no-jit
          node ../tests/arm/run-bare.mjs "$RUNNER_TEMP/guest/tests.bin" -m 512 --jit-threshold 1 --jit-sync
      - uses: actions/upload-artifact@v4
        with:
          name: armless-wasm
          path: arm/armless.wasm

  linux-boot:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: arm
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu flex bison bc linux-source-6.8.0 qemu-user
      - name: Cache kernel
        id: kcache
        uses: actions/cache@v4
        with:
          path: arm/build-linux
          key: linux-6.8-${{ hashFiles('arm/tests/linux/armless_defconfig', 'arm/tests/linux/init.c', 'arm/tests/linux/mkcpio.py') }}
      - name: Build kernel and initramfs
        if: steps.kcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/linux"
          tar xjf /usr/src/linux-source-6.8.0/linux-source-6.8.0.tar.bz2 -C "$RUNNER_TEMP/linux"
          sh tests/linux/build.sh "$RUNNER_TEMP/linux/linux-source-6.8.0" build-linux
      - name: Boot Linux to userspace
        run: sh tests/linux/boot.sh build-linux
      - name: Build busybox + glibc rootfs
        run: |
          git clone --depth 1 https://github.com/mirror/busybox "$RUNNER_TEMP/busybox"
          sh tests/linux/build-rootfs.sh "$RUNNER_TEMP/busybox" build-linux
      - name: Userspace matches qemu-aarch64
        run: |
          if ! sh tests/linux/userspace.sh build-linux > userspace.log 2>&1; then
            cat userspace.log
            echo "::error title=userspace::$(tail -c 1500 userspace.log | tr -d '\r%' | tr '\n' ';')"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build armless.wasm
        run: |
          sudo apt-get install -y clang lld
          rustup target add wasm32-unknown-unknown
          sh build-wasm.sh
      - name: Boot through the V86 JS API (arch arm64, gzip kernel)
        run: |
          gzip -9 -k -f build-linux/Image
          node ../tests/arm/boot.mjs build-linux/Image.gz build-linux/initrd.cpio --expect ARMLESS-BOOT-OK
      - name: snowglobe flow (9p root, virtio console, save/restore zstd snapshot)
        run: |
          pip install --break-system-packages zstandard
          sh ../tests/arm/make-9pfs.sh build-linux/busybox build-linux/Image.gz build-linux/9pfs
          node ../tests/arm/snowglobe.mjs build-linux/9pfs
      - name: Network and 9p stress (integrity and throughput)
        run: |
          node ../tests/arm/netfs.mjs build-linux/9pfs
          NETFS_ONLY=net NET_MTU=65520 node ../tests/arm/netfs.mjs build-linux/9pfs
      - name: Userspace through the V86 JS API with the JIT matches qemu-aarch64
        run: |
          node ../tests/arm/boot.mjs --cmdline "console=ttyS0 rdinit=/init quiet" \
              --expect ARMLESS-USERSPACE-OK build-linux/Image build-linux/rootfs.cpio > v86-userspace.log
          sed -n '/^== userspace ==/,/^ARMLESS-USERSPACE-OK/p' v86-userspace.log \
              | grep -v -e '^== ' -e '^ARMLESS-USERSPACE-OK' -e '^dc' -e 'SERIAL:' | tr -d '\r' > v86-dut.txt
          if ! diff -u build-linux/ref.txt v86-dut.txt > v86-diff.txt; then
            cat v86-diff.txt
            echo "::error title=userspace (V86 + JIT)::$(head -c 1500 v86-diff.txt | tr -d '\r%' | tr '\n' ';')"
            exit 1
          fi

  difftest:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: arm
    strategy:
      matrix:
        classes: [int, fp, simd, simds, ldst]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm gcc-aarch64-linux-gnu qemu-user
          rustup target add wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Differential test against qemu-aarch64
        run: |
          for seed in 1 2 3; do
            if ! sh tests/difftest/run.sh ${{ matrix.classes }} 10000 $seed; then
              # surface the mismatches as an annotation (visible without logs)
              echo "::error title=difftest ${{ matrix.classes }} seed $seed::$(grep -E '^[-+][0-9]' ../build-difftest/diff.txt | head -12 | tr '\n' ';')"
              exit 1
            fi
          done
      - name: Differential test of the wasm JIT against qemu-aarch64
        run: |
          sh build-wasm.sh
          for seed in 1 2; do
            if ! DUT=jit sh tests/difftest/run.sh ${{ matrix.classes }} 5000 $seed; then
              echo "::error title=difftest jit ${{ matrix.classes }} seed $seed::$(grep -E '^[-+][0-9]' ../build-difftest/diff.txt | head -12 | tr '\n' ';')"
              exit 1
            fi
          done

  alpine:
    # A real arm64 Alpine (linux-virt + OpenRC), prepared and booted the way
    # snowglobe does it, through the V86 JS API.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Toolchain
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang lld
          sudo pip install --break-system-packages zstandard
          rustup target add wasm32-unknown-unknown
      - name: Build armless.wasm
        run: sh arm/build-wasm.sh
      - name: Build the Alpine arm64 guest as a 9p filesystem
        run: sh tests/arm/alpine/build.sh "$RUNNER_TEMP/alpine"
      - name: Boot Alpine, run commands, save and restore a snapshot
        run: node tests/arm/alpine.mjs "$RUNNER_TEMP/alpine"
