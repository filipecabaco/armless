name: armless release

# Builds everything a site needs to run either machine:
#   libv86.js / libv86.mjs   the JS runtime (with arch: "arm64" support)
#   armless.wasm             the AArch64 core
#   armless-smp.wasm         its threaded build, for cpu_count > 1
#   v86.wasm, v86-fallback.wasm, seabios/vgabios   the unchanged x86 machine
# and publishes them as a GitHub release (a tarball laid out like the `v86`
# npm package's build/ directory, plus the individual files).

on:
  push:
    tags: ["armless-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          rustup component add rust-src
          sudo apt-get update -y
          sudo apt-get install -y clang lld nasm
      - name: Build
        run: |
          make all
          make build/v86-fallback.wasm
          make armless
      - name: Package
        run: |
          mkdir -p dist/v86-armless/build dist/v86-armless/bios
          cp build/libv86.js build/libv86.mjs build/v86.wasm build/v86-fallback.wasm build/armless.wasm build/armless-smp.wasm dist/v86-armless/build/
          cp bios/seabios.bin bios/vgabios.bin dist/v86-armless/bios/
          cp LICENSE package.json v86.d.ts docs/armless.md dist/v86-armless/
          tar -C dist -czf dist/v86-armless.tar.gz v86-armless
          ls -la dist/v86-armless/build dist/v86-armless.tar.gz
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            tag="armless-snapshot"
            gh release delete "$tag" --yes --cleanup-tag || true
          fi
          gh release create "$tag" --title "$tag" --target "$GITHUB_SHA" \
            --notes "v86 with the armless AArch64 machine. Use new V86({ arch: \"arm64\", wasm_path: \".../armless.wasm\" }). See armless.md." \
            $( [ "$tag" = "armless-snapshot" ] && echo --prerelease ) \
            dist/v86-armless.tar.gz \
            dist/v86-armless/build/libv86.js dist/v86-armless/build/libv86.mjs \
            dist/v86-armless/build/armless.wasm dist/v86-armless/build/armless-smp.wasm dist/v86-armless/build/v86.wasm
