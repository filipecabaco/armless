name: Site

# Gathers the site's content (landing page, examples and docs) with site/build.exs and deploys it
# to Fly (site/fly.toml: site/server.exs renders each page from its template and site/_out, and
# sends the headers that make its pages cross-origin isolated). Every merge to main redeploys it: the docs are cut from Readme.md and
# docs/, the footer carries the version from Cargo.toml, and the machines are put together afresh.
#
# The machines run armless as built from this commit: armless.wasm and armless-smp.wasm by
# build-wasm.sh, and a native armless-run, which boots the guest and saves it for the examples
# that restore a native snapshot (the same commit, so the formats match). Their kernel (Linux
# 6.18, as ci.yml's: 6.10 and later take a VM generation ID from the device tree, which the
# fresh-randomness example shows) and busybox are built the way ci.yml's linux job builds its own
# (tests/linux/build.sh, build-rootfs.sh), and cached. site/demo.exs packs the initramfs
# (site/guest), the user-mode examples' filesystem, and the race's (Alpine's python3, from its
# packages). If any of that fails the site still deploys, and the pages say what is not in it.
#
# A pull request that touches the site, the docs, the guest or armless only builds and tests it,
# so a broken build shows up before it reaches main. The tests are site/test: the CPU count for a
# device, the machine booted on 1 to 8 CPUs, the examples' machines, the server, and the docs'
# cutting, links and anchors.
#
# Deploying needs the repository secret FLY_API_TOKEN: a deploy token of the Fly app armless
# (fly tokens create deploy -a armless).

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - "tests/linux/**"
      - "src/**"
      - "user/**"
      - "js/**"
      - "build-wasm.sh"
      - "Readme.md"
      - "Cargo.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    # The kernel ci.yml's linux job tests
    env:
      LINUX_VERSION: 6.18.60
      LINUX_SHA256: 3c2f44ef6acc021a7ad444d9a2e6ec1ef488ff09368793d0004a6080f69d621e
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "28"
      - name: Cache the guest's kernel and busybox
        id: guest
        uses: actions/cache@v6
        with:
          path: build-linux
          key: site-guest-linux-${{ env.LINUX_VERSION }}-${{ hashFiles('tests/linux/armless_defconfig', 'tests/linux/build.sh', 'tests/linux/init.c', 'tests/linux/mkcpio.py', 'tests/linux/build-rootfs.sh') }}
      - uses: ./.github/actions/apt
        if: steps.guest.outputs.cache-hit != 'true'
        with:
          set: linux
      - name: Build the guest's kernel and busybox
        if: steps.guest.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/linux"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/linux.tar.xz" "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-$LINUX_VERSION.tar.xz"
          echo "$LINUX_SHA256  $RUNNER_TEMP/linux.tar.xz" | sha256sum -c -
          tar xJf "$RUNNER_TEMP/linux.tar.xz" -C "$RUNNER_TEMP/linux"
          sh tests/linux/build.sh "$RUNNER_TEMP/linux/linux-$LINUX_VERSION" build-linux
          git clone --depth 1 https://github.com/mirror/busybox "$RUNNER_TEMP/busybox"
          sh tests/linux/build-rootfs.sh "$RUNNER_TEMP/busybox" build-linux
      - uses: ./.github/actions/apt
        with:
          set: wasm
      - name: Toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          rustup component add rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> build"
          key: site
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # armless as this commit has it: the page's wasm (one CPU, and several) and the native
      # armless-run that saves the snapshot those restore
      - name: Build armless.wasm, armless-smp.wasm and armless-run
        id: native
        run: |
          sh build-wasm.sh
          SMP=1 sh build-wasm.sh
          cargo build --release --bin armless-run
          mkdir -p "$RUNNER_TEMP/armless"
          cp js/armless.js build/armless.wasm build/armless-smp.wasm "$RUNNER_TEMP/armless/"
          echo "bin=$PWD/build/release/armless-run" >> "$GITHUB_OUTPUT"
          echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1) (${GITHUB_SHA::7})" >> "$GITHUB_OUTPUT"
      - name: Put the machines together
        env:
          ARMLESS_BUILD: ${{ runner.temp }}/armless
          ARMLESS_VERSION: ${{ steps.native.outputs.version }}
        run: elixir site/demo.exs build-linux ${{ steps.native.outputs.bin }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The files python3 reads before its first >>>, which the race downloads before it starts
      - name: List the race's startup files
        run: |
          if [ -f site/static/demo/config.json ]; then node site/py-startup.mjs site/static/demo; fi
      - name: Test the CPU count for a device
        run: node --test site/test/cpus.test.mjs
      - name: Test the machine (boot, nproc, trench, ctrl+c) on 1, 2, 4 and 8 CPUs
        run: |
          if [ ! -f site/static/demo/config.json ]; then
            echo "::warning::the machine was not put together; nothing to test"
            exit 0
          fi
          for n in 1 2 4 8; do node site/test/guest.mjs site/static/demo $n; done
      - name: Test the examples' machines (native snapshot, fresh randomness, user mode, time asleep, egress, the race)
        run: |
          if [ ! -f site/static/demo/config.json ]; then
            echo "::warning::the machines were not put together; nothing to test"
            exit 0
          fi
          node site/test/examples.mjs site/static/demo
      - name: Test the site (docs cutting, trench.awk) and its server (routes, old addresses, headers)
        run: |
          elixir site/test/site_test.exs
          elixir site/test/server_test.exs
      - name: Build the site
        run: elixir site/build.exs
      # Every page crawled from / through the server: links, assets and anchors
      - name: Test the build's links and anchors, as the server serves it
        run: elixir site/test/links_test.exs
      - name: Check the build
        run: |
          test -f site/_out/site.etf
          test -f site/_out/static/demo/config.json || echo "::warning::the machines were not put together; the site says so"
          if [ ! -f site/_out/static/demo/native.bin.zst ]; then
            # armless-run built and still no snapshot is a broken build, not a missing release
            if [ "${{ steps.native.outcome }}" = "success" ]; then
              echo "::error::armless-run was built but made no native snapshot"
              exit 1
            fi
            echo "::warning::no native snapshot; its examples say so"
          fi
          if [ ! -d site/_out/static/demo/py ]; then
            echo "::warning::no python filesystem; the race says so"
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
        if: github.event_name != 'pull_request'
      - name: Deploy to Fly
        if: github.event_name != 'pull_request'
        working-directory: site
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --ha=false
