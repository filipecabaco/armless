name: Pages

# Builds the site (landing page, examples and docs) with site/build.exs and publishes it to
# GitHub Pages. Every merge to main redeploys it: the docs are cut from Readme.md and docs/, the
# footer carries the version from Cargo.toml, and the machines are put together afresh.
#
# The machines boot Linux on several CPUs. Their kernel (Linux 6.18, as ci.yml's: 6.10 and later
# take a VM generation ID from the device tree, which the fresh-randomness example shows) and
# busybox are built the way ci.yml's linux job builds its own (tests/linux/build.sh,
# build-rootfs.sh), and cached. site/demo.exs then fetches armless.js and its wasm from the
# latest release, packs the initramfs (site/guest) and the user-mode examples' filesystem, and
# has a native armless-run, built from the release's tag so the formats match, boot the guest
# and save it for the examples that restore a native snapshot. If any of that fails the site
# still deploys, and the pages say what is not in this build.
#
# A pull request that touches the site, the docs or the guest only builds and tests it, so a
# broken build shows up before it reaches main. The tests are site/test: the CPU count for a
# device, the machine booted on 1 to 8 CPUs, the examples' machines, and the docs' cutting,
# links and anchors.
# Pages > Source is "GitHub Actions" in the repository settings.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - "tests/linux/**"
      - "Readme.md"
      - "Cargo.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    # The kernel ci.yml's linux job tests
    env:
      LINUX_VERSION: 6.18.60
      LINUX_SHA256: 3c2f44ef6acc021a7ad444d9a2e6ec1ef488ff09368793d0004a6080f69d621e
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "28"
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
        id: pages
      - name: Cache the guest's kernel and busybox
        id: guest
        uses: actions/cache@v6
        with:
          path: build-linux
          key: site-guest-linux-${{ env.LINUX_VERSION }}-${{ hashFiles('tests/linux/armless_defconfig', 'tests/linux/build.sh', 'tests/linux/init.c', 'tests/linux/mkcpio.py', 'tests/linux/build-rootfs.sh') }}
      - uses: ./.github/actions/apt
        if: steps.guest.outputs.cache-hit != 'true'
        with:
          set: linux
      - name: Build the guest's kernel and busybox
        if: steps.guest.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/linux"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/linux.tar.xz" "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-$LINUX_VERSION.tar.xz"
          echo "$LINUX_SHA256  $RUNNER_TEMP/linux.tar.xz" | sha256sum -c -
          tar xJf "$RUNNER_TEMP/linux.tar.xz" -C "$RUNNER_TEMP/linux"
          sh tests/linux/build.sh "$RUNNER_TEMP/linux/linux-$LINUX_VERSION" build-linux
          git clone --depth 1 https://github.com/mirror/busybox "$RUNNER_TEMP/busybox"
          sh tests/linux/build-rootfs.sh "$RUNNER_TEMP/busybox" build-linux
      # The native snapshot's armless-run: the latest release's, as the wasm site/demo.exs fetches
      - name: Check out the latest release
        id: release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          git fetch --depth 1 origin "refs/tags/$tag:refs/tags/$tag"
          git worktree add "$RUNNER_TEMP/release" "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        if: steps.release.outcome == 'success'
        with:
          workspaces: "${{ runner.temp }}/release -> build"
          key: site-${{ steps.release.outputs.tag }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build armless-run at the latest release
        id: native
        if: steps.release.outcome == 'success'
        continue-on-error: true
        # From inside the checkout: cargo takes .cargo/config.toml (target-dir = "build") from
        # where it runs, not from the manifest's directory
        working-directory: ${{ runner.temp }}/release
        run: |
          cargo build --release --bin armless-run
          test -x build/release/armless-run
          echo "bin=$PWD/build/release/armless-run" >> "$GITHUB_OUTPUT"
      - name: Put the machines together
        run: elixir site/demo.exs build-linux ${{ steps.native.outputs.bin }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Test the CPU count for a device
        run: node --test site/test/cpus.test.mjs
      - name: Test the machine (boot, nproc, trench, ctrl+c) on 1, 2, 4 and 8 CPUs
        run: |
          if [ ! -f site/static/demo/config.json ]; then
            echo "::warning::the machine was not put together; nothing to test"
            exit 0
          fi
          for n in 1 2 4 8; do node site/test/guest.mjs site/static/demo $n; done
      - name: Test the examples' machines (native snapshot, fresh randomness, user mode, time asleep, egress)
        run: |
          if [ ! -f site/static/demo/config.json ]; then
            echo "::warning::the machines were not put together; nothing to test"
            exit 0
          fi
          node site/test/examples.mjs site/static/demo
      - name: Test the site (docs cutting, links, anchors, trench.awk)
        run: elixir site/test/site_test.exs
      - name: Build the site
        run: elixir site/build.exs
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path || '/armless' }}/
      - name: Check the build
        run: |
          test -f site/_out/index.html
          test -f site/_out/docs/index.html
          test -f site/_out/examples/index.html
          test -f site/_out/demo/config.json || echo "::warning::the machines were not put together; the site says so"
          if [ ! -f site/_out/demo/native.bin.zst ]; then
            # armless-run built and still no snapshot is a broken build, not a missing release
            if [ "${{ steps.native.outcome }}" = "success" ]; then
              echo "::error::armless-run was built but made no native snapshot"
              exit 1
            fi
            echo "::warning::no native snapshot; its examples say so"
          fi
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site/_out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
