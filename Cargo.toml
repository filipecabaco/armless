[package]
name = "armless"
version = "0.2.6"
edition = "2021"
publish = false
description = "An AArch64 virtual machine (CPU, JIT, devices) for the browser and native hosts"
license = "BSD-2-Clause"
repository = "https://github.com/filipecabaco/armless"
include = ["src/**", "lib/zstd/**", "js/**", "build-wasm.sh", "LICENSE", "Readme.md"]

[lib]
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
# TLS 1.3 for the web relay (pure Rust, no randomness of their own: the host seeds ours)
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
hmac = { version = "0.12", default-features = false }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "ecdh", "pkcs8", "alloc"] }
sha1 = { version = "0.10", default-features = false }
sha2 = { version = "0.10", default-features = false }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ruzstd = { version = "0.8", default-features = false, features = ["std"] }
# Native egress: HTTPS out of the machine (system roots, so TLS-intercepting proxies work)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
webpki-roots = "1"
# The native JIT: the blocks the JIT translates to wasm, compiled to host code instead (src/jit/native.rs)
cranelift-codegen = { version = "=0.136.2", optional = true }
cranelift-frontend = { version = "=0.136.2", optional = true }
cranelift-jit = { version = "=0.136.2", optional = true }
cranelift-module = { version = "=0.136.2", optional = true }
cranelift-native = { version = "=0.136.2", optional = true }

# The native JIT checks the kernel lets it make new code visible to other cores (membarrier), and
# maps its code memory itself (src/jit/native/code.rs)
[target.'cfg(any(target_os = "linux", all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
libc = { version = "0.2", optional = true }

[features]
default = ["native-jit"]
# Compile hot guest code to host code on native hosts (opt-in at run time: ARMLESS_JIT=native, or
# Cpu::enable_native_jit).
native-jit = ["dep:cranelift-codegen", "dep:cranelift-frontend", "dep:cranelift-jit", "dep:cranelift-module", "dep:cranelift-native", "dep:libc"]
# Compile the wasm export layer natively, to type-check it without a wasm target.
wasm-api = []

[[bin]]
name = "armless-run"
path = "src/bin/armless-run.rs"

[profile.dev]
opt-level = 2
overflow-checks = true

[profile.release]
lto = true
opt-level = 3
panic = "abort"
codegen-units = 1
